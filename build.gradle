plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = 'rampdoor' }
loom { accessWidenerPath = file('src/main/resources/rampdoor.accesswidener') }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
jar { from('LICENSE') { rename { 'LICENSE_rampdoor' } } }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'rampdoor-tests'
        enableGameTests = true
        enableClientGameTests = false
        eula = false
    }
}
// Optional compatibility test only; never bundled into the released mod.
if (providers.gradleProperty('testWorldEdit').isPresent()) {
    dependencies { gametestRuntimeOnly files(providers.gradleProperty('testWorldEdit').get()) }
}
if (providers.gradleProperty('crashPhase').isPresent()) {
    loom.runs.gameTest.vmArg '-Drampdoor.crashPhase=' + providers.gradleProperty('crashPhase').get()
}
